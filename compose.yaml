name: szort

services:
  szort:
    build: .
    image: szort:1.0.0
    restart: always
    env_file: .env
    environment:
      PUBLIC_BASE_URL: https://szorty.infinigy.pl
      LISTEN_ADDR: ":8080"
      DB_PATH: /data/szort.db
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - traefik
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.services.szort.loadbalancer.server.port: "8080"
      traefik.http.routers.szort.rule: "Host(`szorty.infinigy.pl`)"
      traefik.http.routers.szort.entrypoints: websecure
      traefik.http.routers.szort.tls: "true"
      traefik.http.routers.szort.tls.certresolver: myresolver

networks:
  traefik:
    external: true
    name: traefik
