{{if not .Email}}<p class="bench-note">Zaloguj się, żeby skrócić adres.</p>{{end}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Email}}
{{if .NewLink}}
<p class="result-tag"><label>Krótki adres <input id="nowy" readonly value="{{.NewLink}}"></label></p>
{{end}}
<form class="cut-form" method="post" action="/links">
<p><label>Długi adres <input name="url" type="text" maxlength="2048" autocomplete="off" required></label></p>
<p><button type="submit">Szortuj to!</button></p>
</form>
{{template "linklist" .}}
{{end}}
{{template "end" .}}
{{end}}
